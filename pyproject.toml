[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-converter"
version = "1.7.0"
description = "Convert airfoil-plotter CSV exports into SolidWorks curves, and drive them into an open part"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# The SolidWorks link. Optional on purpose: without it the app still writes
# curve files, and the tests still run on a machine with no Windows at all.
live = ["pywin32>=306; sys_platform == 'win32'"]
dev = [
    "pytest>=7",
    "pyinstaller>=6",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.gui-scripts]
airfoil-converter = "airfoil_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: offsets a whole hooked-tip wing; seconds each (deselect with -m 'not slow')",
]
